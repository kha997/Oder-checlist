name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a push burst does not queue stale jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · unit tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fail fast on a broken lockfile instead of falling back to a fresh resolve.
      - name: Install
        run: npm ci

      - name: Typecheck (strict + noUnusedLocals/noUnusedParameters)
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build (includes PWA service worker generation)
        run: npx vite build

  security-rules:
    name: firestore.rules verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator ships as a JAR and needs a JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: npm ci

      - name: Verify security rules against the emulator
        run: npm run test:rules
